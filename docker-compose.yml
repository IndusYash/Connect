version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: friendcirkle-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: friendcirkle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: friendcirkle-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: friendcirkle-backend
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/friendcirkle?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_12345
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: friendcirkle-frontend
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
